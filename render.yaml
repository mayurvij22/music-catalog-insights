services:
  - type: web
    name: music-catalog-api
    runtime: docker
    rootDirectory: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: GEMINI_API_KEY
        sync: false
