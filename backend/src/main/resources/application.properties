# Application Configuration
spring.application.name=music-catalog-api
server.port=${PORT:8080}

# Database Configuration (H2 for dev, PostgreSQL for prod)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:musiccatalog}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIHNlY3JldCBrZXkgZm9yIG11c2ljIGNhdGFsb2cgYXBwbGljYXRpb24gand0IHRva2VuIGdlbmVyYXRpb24=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Gemini AI Configuration (optional)
gemini.api.key=${GEMINI_API_KEY:}

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Server Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# CORS - allow Vercel domains
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# Logging
logging.level.com.musiccatalog=INFO
logging.level.org.springframework.security=WARN
