name: Java Maven TestNG CI

on:
  push:
    branches: [ main, master, test, '*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: java-testng-calculator

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'java-testng-calculator/pom.xml'

    - name: Run Maven Tests
      run: mvn clean test

    - name: Upload TestNG Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: testng-reports
        path: java-testng-calculator/target/surefire-reports/
